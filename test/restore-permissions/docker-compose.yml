version: "3"

# Manual restore verification for ownership behavior with a restic
# repository. This replaces the removed root-owned .tar.gz flow and keeps the
# same profiles: restored files keep their 0:0 owner (preserve mode), and
# RESTORE_CHOWN maps the whole target subtree, including the target root, to
# 1000:1000. The restic snapshot keeps the seeded source directory name
# inside the snapshot, as test/restore-restic/docker-compose.yml demonstrates.
# Non-Docker caveat: the POSIX ownership expectations below follow restic's
# root-owned extraction plus the repository's ownership normalization (see
# test/restore-ownership). Run the profiles on Linux to confirm them; a wrong
# expectation makes the verify service fail loudly.
# Suggested flow:
#   docker compose --profile setup up seed-restic-permission-backup seed-target
#   docker compose --profile preserve up restore-preserve-archive-ownership
#   docker compose --profile preserve up verify-preserved-root-owner
#   docker compose --profile chown up seed-target
#   docker compose --profile chown up restore-chown
#   docker compose --profile chown up verify-chown-after-replacement

services:

  seed-restic-permission-backup:
    build:
      context: ../..
      target: backup-runtime
    profiles: ["setup"]
    entrypoint: /bin/sh
    command: >
      -c "rm -rf /restic-repo/* /source/* &&
          mkdir -p /source/app-data &&
          printf 'restored permissions fixture\n' > /source/app-data/restored.txt &&
          chown -R 0:0 /source &&
          restic init || true &&
          restic backup /source"
    environment:
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - restic-repo:/restic-repo
      - restic-source:/source

  seed-target:
    image: alpine:3.20
    profiles: ["setup", "chown"]
    command: sh -c "mkdir -p /restore-target && printf 'must be removed\n' > /restore-target/stale.txt"
    volumes:
      - restore-target:/restore-target

  restore-preserve-archive-ownership:
    build:
      context: ../..
      target: backup-runtime
    profiles: ["preserve"]
    environment:
      RESTORE_MODE: "true"
      RESTORE_TARGET_PATH: /restore-target
      RESTORE_DRY_RUN: "false"
      RESTORE_FORCE_OVERWRITE: "true"
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - restore-target:/restore-target
      - restic-repo:/restic-repo

  verify-preserved-root-owner:
    image: alpine:3.20
    profiles: ["preserve"]
    depends_on:
      restore-preserve-archive-ownership:
        condition: service_completed_successfully
    command: sh -c "test \"$(stat -c '%u:%g' /restore-target/source/app-data/restored.txt)\" = '0:0'"
    volumes:
      - restore-target:/restore-target:ro

  restore-chown:
    build:
      context: ../..
      target: backup-runtime
    profiles: ["chown"]
    environment:
      RESTORE_MODE: "true"
      RESTORE_TARGET_PATH: /restore-target
      RESTORE_DRY_RUN: "false"
      RESTORE_FORCE_OVERWRITE: "true"
      RESTORE_CHOWN: "1000:1000"
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - restore-target:/restore-target
      - restic-repo:/restic-repo

  verify-chown-after-replacement:
    image: alpine:3.20
    profiles: ["chown"]
    depends_on:
      restore-chown:
        condition: service_completed_successfully
    command: >
      sh -c "test ! -e /restore-target/stale.txt &&
             test \"$(stat -c '%u:%g' /restore-target)\" = '1000:1000' &&
             test \"$(stat -c '%u:%g' /restore-target/source/app-data/restored.txt)\" = '1000:1000'"
    volumes:
      - restore-target:/restore-target:ro

volumes:
  restic-repo:
  restic-source:
  restore-target:
