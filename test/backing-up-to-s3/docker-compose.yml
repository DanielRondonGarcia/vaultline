version: "3"

# Restic-only backup to an S3 bucket. The old BACKUP_FILENAME/TAR upload
# behavior was removed; content is now stored encrypted in a restic
# repository. The bucket below must already exist and the credentials are
# what restic uses to access the S3 backend.

services:

  dashboard:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  backup:
    build: ../..
    environment:
      BACKUP_STRATEGY: restic
      BACKUP_CRON_EXPRESSION: "* * * * *"
      RESTIC_REPOSITORY: s3:s3.amazonaws.com/docker-volume-backup-test-bucket
      RESTIC_PASSWORD: change-me
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    volumes:
      - grafana-data:/backup/grafana-data:ro

volumes:
  grafana-data:
