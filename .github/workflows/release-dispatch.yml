name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag --list \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | while IFS= read -r tag; do printf '%s\t%s\n' "${tag#v}" "$tag"; done \
            | sort -t $'\t' -k1,1V \
            | tail -n 1 \
            | cut -f2- || true)

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tags found. Starting at 0.1.0"
            NEW_VERSION="0.1.0"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"

            case "${{ inputs.bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Previous tag: ${LATEST_TAG:-none}"
          echo "Bump: ${{ inputs.bump }}"
          echo "New version: ${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --list \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | while IFS= read -r tag; do printf '%s\t%s\n' "${tag#v}" "$tag"; done \
            | sort -t $'\t' -k1,1V \
            | tail -n 1 \
            | cut -f2- || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating full changelog"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            echo "Generating changelog from $PREV_TAG"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes since last release"
          fi

          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          cat > release_body.md <<EOF
          ## What's Changed

          $CHANGELOG

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-initial}...${NEW_VERSION}
          EOF

      - name: Upload release notes for publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_body.md
          if-no-files-found: error
          retention-days: 1

  native-linux:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
            pbs_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.11.17%2B20261003-x86_64-unknown-linux-gnu-install_only.tar.gz
            pbs_sha256: c624af93ad62a596806bbd2404e1fb80744a407ca7279854445ede16d93858b8
          - arch: arm64
            runner: ubuntu-24.04-arm
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
            pbs_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.11.17%2B20261003-aarch64-unknown-linux-gnu-install_only.tar.gz
            pbs_sha256: 2238f0556d3a9777d42261b1e4d7b9834d56f111d3dd879a0647c27c824cc31d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build onefile worker in manylinux2014
        run: |
          mkdir -p dist build/pyinstaller-${{ matrix.arch }}
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ${{ matrix.manylinux_image }} \
            bash -lc '
              set -euo pipefail
              mkdir -p /tmp/pbs
              curl -fsSL "${{ matrix.pbs_url }}" -o /tmp/python-build-standalone.tar.gz
              echo "${{ matrix.pbs_sha256 }}  /tmp/python-build-standalone.tar.gz" | sha256sum -c -
              tar -xzf /tmp/python-build-standalone.tar.gz -C /tmp/pbs
              export PATH="/tmp/pbs/python/bin:$PATH"
              export LD_LIBRARY_PATH="/tmp/pbs/python/lib:${LD_LIBRARY_PATH:-}"
              python -c "import pathlib, sysconfig; shared = sysconfig.get_config_var(\"Py_ENABLE_SHARED\"); assert shared == 1, f\"Py_ENABLE_SHARED={shared}\"; assert pathlib.Path(\"/tmp/pbs/python/lib/libpython3.11.so\").is_file(), \"missing libpython3.11.so\"; print(\"Py_ENABLE_SHARED=1\")"
              python -m pip install -r requirements-build.txt
              python -m PyInstaller build/vaultline-worker.spec --distpath /workspace/dist --workpath /workspace/build/pyinstaller-${{ matrix.arch }} --noconfirm
              /workspace/dist/vaultline-worker --help
            '

      - name: Package Debian worker on native host
        run: |
          VERSION="${{ needs.prepare.outputs.new_version }}"
          bash scripts/build_worker_deb.sh "${VERSION}" "${{ matrix.arch }}" "dist/vaultline-worker" "dist/packages"
          test -s "dist/packages/vaultline-worker_${VERSION}_${{ matrix.arch }}.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: vaultline-worker-linux-${{ matrix.arch }}
          path: dist/packages/vaultline-worker_${{ needs.prepare.outputs.new_version }}_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 1

  native-windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build onefile worker
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller build/vaultline-worker.spec --distpath dist --workpath build/pyinstaller-windows-amd64 --noconfirm

      - name: Smoke Windows executable
        shell: pwsh
        run: |
          & dist\vaultline-worker.exe --help
          if ($LASTEXITCODE -ne 0) { throw "vaultline-worker.exe --help exited with $LASTEXITCODE" }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix failed with $LASTEXITCODE" }
          wix --version

      - name: Build MSI installer
        shell: pwsh
        run: |
          $Version = "${{ needs.prepare.outputs.new_version }}"
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null
          wix build -arch x64 -d Version=$Version -d WorkerExe=dist\vaultline-worker.exe -o "dist\release\vaultline-worker_${Version}_windows-amd64.msi" packaging\windows\vaultline-worker.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build exited with $LASTEXITCODE" }
          if (-not (Test-Path "dist\release\vaultline-worker_${Version}_windows-amd64.msi")) { throw "missing Windows MSI asset" }

      - name: Smoke MSI install, service and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = "${{ needs.prepare.outputs.new_version }}"
          $Msi = (Resolve-Path "dist\release\vaultline-worker_${Version}_windows-amd64.msi").Path
          $InstalledExe = "C:\Program Files\Vaultline\vaultline-worker.exe"
          $WorkerLog = "C:\ProgramData\Vaultline\worker\logs\worker.log"

          function Show-LogTail($Path) {
            if (Test-Path $Path) { Write-Host "---- $Path (tail) ----"; Get-Content $Path -Tail 80 | ForEach-Object { Write-Host $_ } }
          }

          # Silent per-machine install; the ServiceControl element starts the service.
          $install = Start-Process msiexec -ArgumentList '/i',"`"$Msi`"",'/qn','/norestart','/l*v','msi-install.log' -Wait -PassThru
          if ($install.ExitCode -ne 0) { Show-LogTail 'msi-install.log'; throw "msiexec /i exited with $($install.ExitCode)" }
          if (-not (Test-Path $InstalledExe)) { Show-LogTail 'msi-install.log'; throw "installed executable missing at $InstalledExe" }

          # The service must reach Running on its own (auto-start, LocalSystem).
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $service = Get-Service VaultlineWorker -ErrorAction SilentlyContinue
            if ($service -and $service.Status -eq 'Running') { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if (-not $service) { Show-LogTail 'msi-install.log'; throw "service VaultlineWorker was not registered" }
          if ($service.Status -ne 'Running') { Show-LogTail $WorkerLog; throw "service VaultlineWorker is $($service.Status), expected Running" }
          Write-Host "VaultlineWorker: $($service.Status) (start type $($service.StartType))"

          & $InstalledExe service status
          if ($LASTEXITCODE -ne 0) { throw "service status exited with $LASTEXITCODE" }

          # The unenrolled daemon logs its idle state on the first loop; the
          # default poll interval (WORKER_POLL_INTERVAL_SECONDS) is 30s, so a
          # 60s window also covers one full re-check cycle.
          $deadline = (Get-Date).AddSeconds(60)
          $waiting = $false
          do {
            if ((Test-Path $WorkerLog) -and (Select-String -Path $WorkerLog -Pattern 'Waiting for enrollment' -Quiet)) { $waiting = $true; break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          Show-LogTail $WorkerLog
          if (-not $waiting) { throw "worker log did not report 'Waiting for enrollment' at $WorkerLog" }

          # Silent uninstall stops and removes the service; state dir is permanent.
          $uninstall = Start-Process msiexec -ArgumentList '/x',"`"$Msi`"",'/qn','/norestart','/l*v','msi-uninstall.log' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { Show-LogTail 'msi-uninstall.log'; throw "msiexec /x exited with $($uninstall.ExitCode)" }
          if ($null -ne (Get-Service VaultlineWorker -ErrorAction SilentlyContinue)) { throw "service VaultlineWorker still registered after uninstall" }
          if (Test-Path $InstalledExe) { throw "installed executable still present after uninstall" }
          if (-not (Test-Path "C:\ProgramData\Vaultline\worker")) { throw "state directory must survive uninstall" }
          Write-Host "MSI smoke passed: install, running service, idle log, uninstall"

      - name: Name Windows executable
        shell: pwsh
        run: |
          $Version = "${{ needs.prepare.outputs.new_version }}"
          Move-Item -Path dist\vaultline-worker.exe -Destination "dist\release\vaultline-worker_${Version}_windows-amd64.exe"
          if (-not (Test-Path "dist\release\vaultline-worker_${Version}_windows-amd64.exe")) { throw "missing Windows release asset" }

      - name: Upload Windows executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: vaultline-worker-windows-amd64
          path: |
            dist/release/vaultline-worker_${{ needs.prepare.outputs.new_version }}_windows-amd64.exe
            dist/release/vaultline-worker_${{ needs.prepare.outputs.new_version }}_windows-amd64.msi
          if-no-files-found: error
          retention-days: 1

  image-build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── Docker build & push ──

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backup runtime image
        id: meta_runtime
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.new_version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.new_version }}
            type=raw,value=latest

      - name: Extract metadata for Control Plane image
        id: meta_control_plane
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-control-plane
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.new_version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.new_version }}
            type=raw,value=latest

      - name: Extract metadata for Worker image
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-worker
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.new_version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.new_version }}
            type=raw,value=latest

      - name: Build and push backup runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backup-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_runtime.outputs.tags }}
          labels: ${{ steps.meta_runtime.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.new_version }}
            PYTHON_BASE_IMAGE=public.ecr.aws/docker/library/python:3.11-slim-bookworm
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Control Plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: control-plane
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_control_plane.outputs.tags }}
          labels: ${{ steps.meta_control_plane.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.new_version }}
            PYTHON_BASE_IMAGE=public.ecr.aws/docker/library/python:3.11-slim-bookworm
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          # The published worker image supports both WORKER_RUNTIME=docker
          # and WORKER_RUNTIME=kubernetes. Keep Docker CLI available for the
          # existing Docker/Compose deployment while the Kubernetes client is
          # supplied by requirements.txt.
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.new_version }}
            INSTALL_DOCKER_CLI=true
            PYTHON_BASE_IMAGE=public.ecr.aws/docker/library/python:3.11-slim-bookworm
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    needs:
      - prepare
      - native-linux
      - native-windows
      - image-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native release assets
        uses: actions/download-artifact@v4
        with:
          pattern: vaultline-worker-*
          path: dist/release-assets
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Validate assets and generate checksums
        run: |
          VERSION="${{ needs.prepare.outputs.new_version }}"
          cd dist/release-assets
          required=(
            "vaultline-worker_${VERSION}_amd64.deb"
            "vaultline-worker_${VERSION}_arm64.deb"
            "vaultline-worker_${VERSION}_windows-amd64.exe"
            "vaultline-worker_${VERSION}_windows-amd64.msi"
          )
          for asset in "${required[@]}"; do
            test -s "$asset"
          done
          sha256sum "${required[@]}" > "vaultline-worker_${VERSION}_SHA256SUMS"
          test -s "vaultline-worker_${VERSION}_SHA256SUMS"

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_body.md \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            "dist/release-assets/vaultline-worker_${VERSION}_amd64.deb" \
            "dist/release-assets/vaultline-worker_${VERSION}_arm64.deb" \
            "dist/release-assets/vaultline-worker_${VERSION}_windows-amd64.exe" \
            "dist/release-assets/vaultline-worker_${VERSION}_windows-amd64.msi" \
            "dist/release-assets/vaultline-worker_${VERSION}_SHA256SUMS"
