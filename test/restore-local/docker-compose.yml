version: "3"

# Manual restore verification with a restic repository. This replaces the
# removed local .tar.gz flow and keeps the same profiles: dry-run preview,
# loud failure cases (missing target path, missing force overwrite) and the
# force-overwrite end-to-end verification. The restic snapshot keeps the
# seeded source directory name inside the snapshot, exactly as
# test/restore-restic/docker-compose.yml demonstrates.
# Suggested flow:
#   docker compose --profile setup up seed-restic-backups seed-target
#   docker compose --profile dry-run up restore-dry-run-latest
#   docker compose --profile failures up restore-missing-target restore-no-force
#   docker compose --profile force up restore-force-overwrite
#   docker compose --profile force up verify-force-overwrite

services:

  seed-restic-backups:
    build:
      context: ../..
      target: backup-runtime
    profiles: ["setup"]
    entrypoint: /bin/sh
    command: >
      -c "rm -rf /restic-repo/* /source/* &&
          mkdir -p /source &&
          printf 'old backup\n' > /source/restored.txt &&
          restic init || true &&
          restic backup /source &&
          sleep 1 &&
          printf 'latest backup\n' > /source/restored.txt &&
          restic backup /source"
    environment:
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - restic-repo:/restic-repo
      - restic-source:/source

  seed-target:
    image: alpine:3.20
    profiles: ["setup"]
    command: sh -c "mkdir -p /restore-target && printf 'stale target\n' > /restore-target/stale.txt"
    volumes:
      - restore-target:/restore-target

  restore-dry-run-latest:
    build:
      context: ../..
      target: backup-runtime
    profiles: ["dry-run"]
    environment:
      RESTORE_MODE: "true"
      RESTORE_TARGET_PATH: /restore-target
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - restore-target:/restore-target
      - restic-repo:/restic-repo
      - /var/run/docker.sock:/var/run/docker.sock:ro

  restore-missing-target:
    build:
      context: ../..
      target: backup-runtime
    profiles: ["failures"]
    environment:
      RESTORE_MODE: "true"
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - restic-repo:/restic-repo

  restore-no-force:
    build:
      context: ../..
      target: backup-runtime
    profiles: ["failures"]
    environment:
      RESTORE_MODE: "true"
      RESTORE_TARGET_PATH: /restore-target
      RESTORE_SOURCE: latest
      RESTORE_DRY_RUN: "false"
      RESTORE_FORCE_OVERWRITE: "false"
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - restore-target:/restore-target
      - restic-repo:/restic-repo

  restore-force-overwrite:
    build:
      context: ../..
      target: backup-runtime
    profiles: ["force"]
    environment:
      RESTORE_MODE: "true"
      RESTORE_TARGET_PATH: /restore-target
      RESTORE_DRY_RUN: "false"
      RESTORE_FORCE_OVERWRITE: "true"
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - restore-target:/restore-target
      - restic-repo:/restic-repo

  verify-force-overwrite:
    image: alpine:3.20
    profiles: ["force"]
    depends_on:
      restore-force-overwrite:
        condition: service_completed_successfully
    command: >
      sh -c "test -f /restore-target/source/restored.txt &&
             grep -q 'latest backup' /restore-target/source/restored.txt &&
             test ! -e /restore-target/stale.txt"
    volumes:
      - restore-target:/restore-target:ro

volumes:
  restic-repo:
  restic-source:
  restore-target:
