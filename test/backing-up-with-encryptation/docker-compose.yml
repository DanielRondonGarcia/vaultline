version: "3"

# Restic-only backup with encryption at rest. The repository is always stored
# encrypted by restic using RESTIC_PASSWORD (AES-256 content encryption), which
# replaces the removed GPG/TAR passphrase behavior. A local restic
# repository is created automatically on first backup at ./backups/restic-repo.

services:

  dashboard:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  backup:
    build: ../..
    environment:
      BACKUP_STRATEGY: restic
      BACKUP_CRON_EXPRESSION: "* * * * *"
      RESTIC_REPOSITORY: /archive/restic-repo
      RESTIC_PASSWORD: changeme
    volumes:
      - grafana-data:/backup/grafana-data:ro
      - ./backups:/archive

volumes:
  grafana-data:
