version: "3"

# UNSUPPORTED (TAR removed): this scenario backed volumes up to an S3 Glacier
# vault from removed TAR/GPG uploads. The application is Restic-only, and
# restic does not write directly into S3 Glacier vaults. The notice service
# below exits non-zero on purpose so running this scenario cannot be silently
# mistaken for a successful backup.
# For a working backup use a restic-compatible backend instead:
#   test/backing-up-to-s3 (restic S3 backend)
#   examples/restic-rclone (restic rclone backend)

services:

  unsupported-glacier-notice:
    image: alpine:3.20
    command: >
      sh -c "echo 'UNSUPPORTED (TAR removed): S3 Glacier vault uploads as part of the TAR strategy are no longer supported; the application is Restic-only.' &&
             echo 'Restic does not write directly to S3 Glacier vaults; configure an S3 or rclone repository instead.' &&
             echo 'Working examples: test/backing-up-to-s3 and examples/restic-rclone.' &&
             exit 1"
