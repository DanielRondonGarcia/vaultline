name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag --list \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | while IFS= read -r tag; do printf '%s\t%s\n' "${tag#v}" "$tag"; done \
            | sort -t $'\t' -k1,1V \
            | tail -n 1 \
            | cut -f2- || true)

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tags found. Starting at 0.1.0"
            NEW_VERSION="0.1.0"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"

            case "${{ inputs.bump }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Previous tag: ${LATEST_TAG:-none}"
          echo "Bump: ${{ inputs.bump }}"
          echo "New version: ${NEW_VERSION}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --list \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | while IFS= read -r tag; do printf '%s\t%s\n' "${tag#v}" "$tag"; done \
            | sort -t $'\t' -k1,1V \
            | tail -n 1 \
            | cut -f2- || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating full changelog"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            echo "Generating changelog from $PREV_TAG"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes since last release"
          fi

          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          cat > release_body.md <<EOF
          ## What's Changed

          $CHANGELOG

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-initial}...${NEW_VERSION}
          EOF

      - name: Upload release notes for publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_body.md
          if-no-files-found: error
          retention-days: 1

  native-linux:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
            pbs_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.11.17%2B20261003-x86_64-unknown-linux-gnu-install_only.tar.gz
            pbs_sha256: c624af93ad62a596806bbd2404e1fb80744a407ca7279854445ede16d93858b8
          - arch: arm64
            runner: ubuntu-24.04-arm
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
            pbs_url: https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.11.17%2B20261003-aarch64-unknown-linux-gnu-install_only.tar.gz
            pbs_sha256: 2238f0556d3a9777d42261b1e4d7b9834d56f111d3dd879a0647c27c824cc31d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build onefile worker in manylinux2014
        run: |
          mkdir -p dist build/pyinstaller-${{ matrix.arch }}
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            ${{ matrix.manylinux_image }} \
            bash -lc '
              set -euo pipefail
              mkdir -p /tmp/pbs
              curl -fsSL "${{ matrix.pbs_url }}" -o /tmp/python-build-standalone.tar.gz
              echo "${{ matrix.pbs_sha256 }}  /tmp/python-build-standalone.tar.gz" | sha256sum -c -
              tar -xzf /tmp/python-build-standalone.tar.gz -C /tmp/pbs
              export PATH="/tmp/pbs/python/bin:$PATH"
              export LD_LIBRARY_PATH="/tmp/pbs/python/lib:${LD_LIBRARY_PATH:-}"
              python -c "import pathlib, sysconfig; shared = sysconfig.get_config_var(\"Py_ENABLE_SHARED\"); assert shared == 1, f\"Py_ENABLE_SHARED={shared}\"; assert pathlib.Path(\"/tmp/pbs/python/lib/libpython3.11.so\").is_file(), \"missing libpython3.11.so\"; print(\"Py_ENABLE_SHARED=1\")"
              python -m pip install -r requirements-build.txt
              python scripts/check_python_runtime.py
              python scripts/set_worker_build_version.py "${{ needs.prepare.outputs.new_version }}"
              python /workspace/scripts/download_pinned_restic.py --platform linux --arch "${{ matrix.arch }}" --output-dir /tmp/vaultline-restic
              python /workspace/scripts/download_pinned_rclone.py --platform linux --arch "${{ matrix.arch }}" --output-dir /tmp/vaultline-rclone
              export VAULTLINE_RESTIC_BINARY=/tmp/vaultline-restic/restic
              export VAULTLINE_RCLONE_BINARY=/tmp/vaultline-rclone/rclone
              python -m PyInstaller build/vaultline-worker.spec --distpath /workspace/dist --workpath /workspace/build/pyinstaller-${{ matrix.arch }} --noconfirm
              /workspace/dist/vaultline-worker --help
              install -m 0755 "$VAULTLINE_RESTIC_BINARY" /workspace/dist/restic
              install -m 0755 "$VAULTLINE_RCLONE_BINARY" /workspace/dist/rclone
            '

      - name: Package Debian worker on native host
        run: |
          VERSION="${{ needs.prepare.outputs.new_version }}"
          export VAULTLINE_RESTIC_BINARY=dist/restic
          export VAULTLINE_RCLONE_BINARY=dist/rclone
          bash scripts/build_worker_deb.sh "${VERSION}" "${{ matrix.arch }}" "dist/vaultline-worker" "dist/packages"
          test -s "dist/packages/vaultline-worker_${VERSION}_${{ matrix.arch }}.deb"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: vaultline-worker-linux-${{ matrix.arch }}
          path: dist/packages/vaultline-worker_${{ needs.prepare.outputs.new_version }}_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 1

  native-windows:
    needs: prepare
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # setup-python@v5 offers no exact 3.11.17 interpreter on Windows, so use
      # the checksum-verified python-build-standalone install-only archive for
      # the same 20261003 release already pinned for the Linux native builds.
      - name: Download pinned Python 3.11.17 runtime
        shell: pwsh
        env:
          PBS_PYTHON_SHA256: 0f7defa7a0ed99b61e0df0bba5027474711521f1307cc3830c2f456401beeed5
        run: |
          $ErrorActionPreference = 'Stop'
          $Archive = Join-Path $env:RUNNER_TEMP "cpython-3.11.17-pbs-windows-install_only.tar.gz"
          $Url = 'https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.11.17%2B20261003-x86_64-pc-windows-msvc-install_only.tar.gz'
          Invoke-WebRequest -Uri $Url -OutFile $Archive
          $Digest = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Digest -ne $env:PBS_PYTHON_SHA256) { throw "python archive checksum mismatch: expected $env:PBS_PYTHON_SHA256, got $Digest" }
          $InstallDir = Join-Path $env:RUNNER_TEMP "python-3.11.17"
          New-Item -ItemType Directory -Force -Path $InstallDir | Out-Null
          tar -xzf $Archive -C $InstallDir
          if ($LASTEXITCODE -ne 0) { throw "pinned PBS python extract exited with $LASTEXITCODE" }
          # install_only archives root at ./python; put the interpreter and its
          # Scripts directory on PATH so every later step runs the same build.
          Add-Content $env:GITHUB_PATH (Join-Path $InstallDir "python")
          Add-Content $env:GITHUB_PATH (Join-Path $InstallDir "python\Scripts")

      - name: Verify pinned Python runtime against .python-version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Pinned = (Get-Content -LiteralPath .python-version).Trim()
          $Actual = python -c "import sys; print('%d.%d.%d' % sys.version_info[:3])"
          if ($LASTEXITCODE -ne 0) { throw "python -c version probe exited with $LASTEXITCODE" }
          if ($Actual -ne $Pinned) { throw "python runtime mismatch: .python-version pins $Pinned, running on $Actual" }
          $ResolvedPython = (Get-Command python).Source
          if (-not ($ResolvedPython -like (Join-Path $env:RUNNER_TEMP "*"))) { throw "python resolved to $ResolvedPython outside the pinned RUNNER_TEMP install" }
          Write-Host "Pinned CPython $Pinned is on PATH at $ResolvedPython"

      - name: Build stable launcher and versioned worker runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = [version]"${{ needs.prepare.outputs.new_version }}"
          if ($Version.Build -gt 0) { $LowerVersion = "$($Version.Major).$($Version.Minor).$($Version.Build - 1)" }
          elseif ($Version.Minor -gt 0) { $LowerVersion = "$($Version.Major).$($Version.Minor - 1).999" }
          elseif ($Version.Major -gt 0) { $LowerVersion = "$($Version.Major - 1).999.999" }
          else { throw "Cannot derive a lower MSI version from $Version" }
          python -m pip install -r requirements-build.txt
          python scripts/check_python_runtime.py
          if ($LASTEXITCODE -ne 0) { throw "pinned runtime/startup check exited with $LASTEXITCODE" }
          $ResticOutput = Join-Path $env:RUNNER_TEMP "vaultline-restic-v0.19.1"
          $RcloneOutput = Join-Path $env:RUNNER_TEMP "vaultline-rclone-v1.75.2"
          python scripts/download_pinned_restic.py --platform windows --arch amd64 --output-dir "$ResticOutput"
          if ($LASTEXITCODE -ne 0) { throw "pinned Restic download failed with $LASTEXITCODE" }
          python scripts/download_pinned_rclone.py --platform windows --arch amd64 --output-dir "$RcloneOutput"
          if ($LASTEXITCODE -ne 0) { throw "pinned rclone download failed with $LASTEXITCODE" }
          $env:VAULTLINE_RESTIC_BINARY = Join-Path $ResticOutput "restic.exe"
          $env:VAULTLINE_RCLONE_BINARY = Join-Path $RcloneOutput "rclone.exe"
          python -m PyInstaller build/vaultline-worker-launcher.spec --distpath dist --workpath build/pyinstaller-launcher-windows-amd64 --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "stable launcher build exited with $LASTEXITCODE" }
          python scripts/set_worker_build_version.py $LowerVersion
          python -m PyInstaller build/vaultline-worker.spec --distpath dist\lower --workpath build/pyinstaller-worker-lower-windows-amd64 --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "lower-version runtime build exited with $LASTEXITCODE" }
          python scripts/set_worker_build_version.py "${{ needs.prepare.outputs.new_version }}"
          python -m PyInstaller build/vaultline-worker.spec --distpath dist --workpath build/pyinstaller-windows-amd64 --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "current-version runtime build exited with $LASTEXITCODE" }
          Copy-Item -LiteralPath $env:VAULTLINE_RESTIC_BINARY -Destination dist\restic.exe
          Copy-Item -LiteralPath $env:VAULTLINE_RCLONE_BINARY -Destination dist\rclone.exe
          Remove-Item -LiteralPath $ResticOutput -Recurse -Force
          Remove-Item -LiteralPath $RcloneOutput -Recurse -Force

      - name: Smoke Windows executable
        shell: pwsh
        run: |
          & dist\vaultline-worker.exe --help
          if ($LASTEXITCODE -ne 0) { throw "stable vaultline-worker.exe --help exited with $LASTEXITCODE" }
          $LauncherFileVersion = (Get-Item dist\vaultline-worker.exe).VersionInfo.FileVersion
          if ($LauncherFileVersion -ne '4.0.0.0') { throw "launcher FileVersion is $LauncherFileVersion, expected fixed 4.0.0.0" }
          Write-Host "launcher FileVersion: $LauncherFileVersion"
          & dist\vaultline-worker-runtime.exe --help
          if ($LASTEXITCODE -ne 0) { throw "vaultline-worker-runtime.exe --help exited with $LASTEXITCODE" }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install wix failed with $LASTEXITCODE" }
          wix --version
          wix extension add -g WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix Util extension install failed with $LASTEXITCODE" }

      - name: Build MSI installer
        shell: pwsh
        run: |
          $Version = "${{ needs.prepare.outputs.new_version }}"
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null
          wix build -arch x64 -ext WixToolset.Util.wixext -d Version=$Version -d LauncherExe=dist\vaultline-worker.exe -d WorkerExe=dist\vaultline-worker-runtime.exe -d ResticExe=dist\restic.exe -d RcloneExe=dist\rclone.exe -o "dist\release\vaultline-worker_${Version}_windows-amd64.msi" packaging\windows\vaultline-worker.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build exited with $LASTEXITCODE" }
          if (-not (Test-Path "dist\release\vaultline-worker_${Version}_windows-amd64.msi")) { throw "missing Windows MSI asset" }

      - name: Build lower-version MSI for upgrade smoke
        shell: pwsh
        run: |
          $Version = [version]"${{ needs.prepare.outputs.new_version }}"
          if ($Version.Build -gt 0) { $LowerVersion = "$($Version.Major).$($Version.Minor).$($Version.Build - 1)" }
          elseif ($Version.Minor -gt 0) { $LowerVersion = "$($Version.Major).$($Version.Minor - 1).999" }
          elseif ($Version.Major -gt 0) { $LowerVersion = "$($Version.Major - 1).999.999" }
          else { throw "Cannot derive a lower MSI version from $Version" }
          wix build -arch x64 -ext WixToolset.Util.wixext -d Version=$LowerVersion -d LauncherExe=dist\vaultline-worker.exe -d WorkerExe=dist\lower\vaultline-worker-runtime.exe -d ResticExe=dist\restic.exe -d RcloneExe=dist\rclone.exe -o "dist\release\vaultline-worker_${LowerVersion}_windows-amd64.msi" packaging\windows\vaultline-worker.wxs
          if ($LASTEXITCODE -ne 0) { throw "lower-version wix build exited with $LASTEXITCODE" }

      - name: Smoke MSI install, service and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = "${{ needs.prepare.outputs.new_version }}"
          $Msi = (Resolve-Path "dist\release\vaultline-worker_${Version}_windows-amd64.msi").Path
          $LowerVersion = [version]$Version
          if ($LowerVersion.Build -gt 0) { $LowerVersion = [version]"$($LowerVersion.Major).$($LowerVersion.Minor).$($LowerVersion.Build - 1)" }
          elseif ($LowerVersion.Minor -gt 0) { $LowerVersion = [version]"$($LowerVersion.Major).$($LowerVersion.Minor - 1).999" }
          else { $LowerVersion = [version]"$($LowerVersion.Major - 1).999.999" }
          $LowerMsi = (Resolve-Path "dist\release\vaultline-worker_${LowerVersion}_windows-amd64.msi").Path
          $InstalledExe = "C:\Program Files\Vaultline\vaultline-worker.exe"
          $InstalledRuntime = "C:\Program Files\Vaultline\vaultline-worker-runtime.exe"
          $InstalledTools = @("C:\Program Files\Vaultline\restic.exe", "C:\Program Files\Vaultline\rclone.exe")
          $WorkerLog = "C:\ProgramData\Vaultline\worker\logs\worker.log"

          function Show-LogTail($Path) {
            if (Test-Path $Path) { Write-Host "---- $Path (tail) ----"; Get-Content $Path -Tail 80 | ForEach-Object { Write-Host $_ } }
          }

          # Install an older product first, then exercise the actual major-upgrade path.
          $installOld = Start-Process msiexec -ArgumentList '/i',"`"$LowerMsi`"",'/qn','/norestart','/l*v','msi-install-old.log' -Wait -PassThru
          if ($installOld.ExitCode -ne 0) { Show-LogTail 'msi-install-old.log'; throw "lower-version msiexec /i exited with $($installOld.ExitCode)" }
          if (-not (Test-Path $InstalledRuntime)) { throw "lower-version runtime missing at $InstalledRuntime" }
          $LowerRuntimeVersion = & $InstalledRuntime --version
          if ($LASTEXITCODE -ne 0 -or $LowerRuntimeVersion -notmatch [regex]::Escape($LowerVersion.ToString())) { throw "lower MSI installed wrong runtime version: $LowerRuntimeVersion" }
          $LauncherHashBeforeUpgrade = (Get-FileHash -LiteralPath $InstalledExe -Algorithm SHA256).Hash
          $upgrade = Start-Process msiexec -ArgumentList '/i',"`"$Msi`"",'/qn','/norestart','/l*v','msi-upgrade.log' -Wait -PassThru
          # 3010 is Windows Installer's success-with-reboot code, the same
          # success pair the updater accepts in src/worker_agent/update.py.
          if ($upgrade.ExitCode -ne 0 -and $upgrade.ExitCode -ne 3010) { Show-LogTail 'msi-upgrade.log'; throw "major-upgrade msiexec /i exited with $($upgrade.ExitCode)" }
          if ($upgrade.ExitCode -eq 3010) { Write-Host "major upgrade completed with exit code 3010; a Windows restart is required" }
          if (-not (Test-Path $InstalledExe)) { Show-LogTail 'msi-upgrade.log'; throw "stable launcher missing at $InstalledExe" }
          if (-not (Test-Path $InstalledRuntime)) { Show-LogTail 'msi-upgrade.log'; throw "replaceable runtime missing at $InstalledRuntime" }
          $LauncherHashAfterUpgrade = (Get-FileHash -LiteralPath $InstalledExe -Algorithm SHA256).Hash
          if ($LauncherHashAfterUpgrade -ne $LauncherHashBeforeUpgrade) { throw "stable launcher changed during major upgrade" }
          $RuntimeVersion = & $InstalledRuntime --version
          if ($LASTEXITCODE -ne 0 -or $RuntimeVersion -notmatch [regex]::Escape($Version)) { throw "major upgrade installed wrong runtime version: $RuntimeVersion" }
          foreach ($tool in $InstalledTools) { if (-not (Test-Path $tool)) { Show-LogTail 'msi-upgrade.log'; throw "installed tool missing at $tool" } }

          # The service must reach Running on its own (auto-start, LocalSystem).
          $deadline = (Get-Date).AddSeconds(30)
          do {
            $service = Get-Service VaultlineWorker -ErrorAction SilentlyContinue
            if ($service -and $service.Status -eq 'Running') { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if (-not $service) { Show-LogTail 'msi-upgrade.log'; throw "service VaultlineWorker was not registered after upgrade" }
          if ($service.Status -ne 'Running') { Show-LogTail $WorkerLog; throw "service VaultlineWorker is $($service.Status), expected Running after upgrade" }
          Write-Host "VaultlineWorker: $($service.Status) (start type $($service.StartType))"

          & $InstalledExe service status
          if ($LASTEXITCODE -ne 0) { throw "service status exited with $LASTEXITCODE" }

          # The unenrolled daemon logs its idle state on the first loop; the
          # default poll interval (WORKER_POLL_INTERVAL_SECONDS) is 30s, so a
          # 60s window also covers one full re-check cycle.
          $deadline = (Get-Date).AddSeconds(60)
          $waiting = $false
          do {
            if ((Test-Path $WorkerLog) -and (Select-String -Path $WorkerLog -Pattern 'Waiting for enrollment' -Quiet)) { $waiting = $true; break }
            Start-Sleep -Seconds 3
          } while ((Get-Date) -lt $deadline)
          Show-LogTail $WorkerLog
          if (-not $waiting) { throw "worker log did not report 'Waiting for enrollment' at $WorkerLog" }

          # Silent uninstall stops and removes the service; state dir is permanent.
          $uninstall = Start-Process msiexec -ArgumentList '/x',"`"$Msi`"",'/qn','/norestart','/l*v','msi-uninstall.log' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { Show-LogTail 'msi-uninstall.log'; throw "msiexec /x exited with $($uninstall.ExitCode)" }
          if ($null -ne (Get-Service VaultlineWorker -ErrorAction SilentlyContinue)) { throw "service VaultlineWorker still registered after uninstall" }
          if (Test-Path $InstalledExe) { throw "stable launcher still present after uninstall" }
          if (Test-Path $InstalledRuntime) { throw "worker runtime still present after uninstall" }
          foreach ($tool in $InstalledTools) { if (Test-Path $tool) { throw "installed tool still present after uninstall: $tool" } }
          if (-not (Test-Path "C:\ProgramData\Vaultline\worker")) { throw "state directory must survive uninstall" }
          Write-Host "MSI smoke passed: lower-version install, major upgrade, running service, idle log, uninstall"

      - name: Name Windows executable
        shell: pwsh
        run: |
          $Version = "${{ needs.prepare.outputs.new_version }}"
          Move-Item -Path dist\vaultline-worker-runtime.exe -Destination "dist\release\vaultline-worker_${Version}_windows-amd64.exe"
          if (-not (Test-Path "dist\release\vaultline-worker_${Version}_windows-amd64.exe")) { throw "missing Windows release asset" }

      - name: Upload Windows executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: vaultline-worker-windows-amd64
          path: |
            dist/release/vaultline-worker_${{ needs.prepare.outputs.new_version }}_windows-amd64.exe
            dist/release/vaultline-worker_${{ needs.prepare.outputs.new_version }}_windows-amd64.msi
          if-no-files-found: error
          retention-days: 1
          # Mitigation only: the exe/MSI binaries are incompressible, so skip
          # the redundant archive compression for this upload. Not a claim
          # about the root cause of any hosted-runner communication loss.
          compression-level: 0

  image-build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── Docker build & push ──
      # ECR Public's anonymous transfer quota was exhausted. Use Google's
      # cached Docker Hub mirror, pinned to the same official Python manifest.
      # The Dockerfile's Docker Hub default remains unchanged for local builds.

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backup runtime image
        id: meta_runtime
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.new_version }},enable=${{ !inputs.prerelease }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.new_version }},enable=${{ !inputs.prerelease }}
            type=raw,value=latest,enable=${{ !inputs.prerelease }}

      - name: Extract metadata for Control Plane image
        id: meta_control_plane
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-control-plane
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.new_version }},enable=${{ !inputs.prerelease }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.new_version }},enable=${{ !inputs.prerelease }}
            type=raw,value=latest,enable=${{ !inputs.prerelease }}

      - name: Extract metadata for Worker image
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-worker
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.new_version }},enable=${{ !inputs.prerelease }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.new_version }},enable=${{ !inputs.prerelease }}
            type=raw,value=latest,enable=${{ !inputs.prerelease }}

      - name: Build and push backup runtime image
        # The standard Docker CLI path is native amd64; it cannot use the
        # Buildx-only GitHub Actions cache importer/exporter.
        env:
          IMAGE_TAGS: ${{ steps.meta_runtime.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta_runtime.outputs.labels }}
          APP_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          set -euo pipefail
          image_tags=()
          docker_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              image_tags+=("$tag")
              docker_args+=(--tag "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          while IFS= read -r label; do
            if [[ -n "$label" ]]; then docker_args+=(--label "$label"); fi
          done <<< "$IMAGE_LABELS"
          if ((${#image_tags[@]} == 0)); then
            echo "No metadata tags generated for backup runtime image" >&2
            exit 1
          fi
          docker build \
            --platform linux/amd64 \
            --target backup-runtime \
            --build-arg "APP_VERSION=${APP_VERSION}" \
            --build-arg "PYTHON_BASE_IMAGE=mirror.gcr.io/library/python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89" \
            "${docker_args[@]}" \
            .
          for tag in "${image_tags[@]}"; do
            docker push "$tag"
          done

      - name: Build and push Control Plane image
        env:
          IMAGE_TAGS: ${{ steps.meta_control_plane.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta_control_plane.outputs.labels }}
          APP_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          set -euo pipefail
          image_tags=()
          docker_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              image_tags+=("$tag")
              docker_args+=(--tag "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          while IFS= read -r label; do
            if [[ -n "$label" ]]; then docker_args+=(--label "$label"); fi
          done <<< "$IMAGE_LABELS"
          if ((${#image_tags[@]} == 0)); then
            echo "No metadata tags generated for Control Plane image" >&2
            exit 1
          fi
          docker build \
            --platform linux/amd64 \
            --target control-plane \
            --build-arg "APP_VERSION=${APP_VERSION}" \
            --build-arg "PYTHON_BASE_IMAGE=mirror.gcr.io/library/python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89" \
            "${docker_args[@]}" \
            .
          for tag in "${image_tags[@]}"; do
            docker push "$tag"
          done

      - name: Build and push Worker image
        env:
          IMAGE_TAGS: ${{ steps.meta_worker.outputs.tags }}
          IMAGE_LABELS: ${{ steps.meta_worker.outputs.labels }}
          APP_VERSION: ${{ needs.prepare.outputs.new_version }}
        run: |
          set -euo pipefail
          image_tags=()
          docker_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              image_tags+=("$tag")
              docker_args+=(--tag "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          while IFS= read -r label; do
            if [[ -n "$label" ]]; then docker_args+=(--label "$label"); fi
          done <<< "$IMAGE_LABELS"
          if ((${#image_tags[@]} == 0)); then
            echo "No metadata tags generated for Worker image" >&2
            exit 1
          fi
          # Keep Docker CLI available for Docker/Compose deployments; the
          # Kubernetes client is supplied by requirements.txt.
          docker build \
            --platform linux/amd64 \
            --target worker \
            --build-arg "APP_VERSION=${APP_VERSION}" \
            --build-arg "INSTALL_DOCKER_CLI=true" \
            --build-arg "PYTHON_BASE_IMAGE=mirror.gcr.io/library/python@sha256:0a310eeecf4e1f5a0743f9a6520c90c88d089c903ca5fd283f501e3a805f5f89" \
            "${docker_args[@]}" \
            .
          for tag in "${image_tags[@]}"; do
            docker push "$tag"
          done

  publish-release:
    needs:
      - prepare
      - native-linux
      - native-windows
      - image-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download native release assets
        uses: actions/download-artifact@v4
        with:
          pattern: vaultline-worker-*
          path: dist/release-assets
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Validate assets and generate checksums
        run: |
          VERSION="${{ needs.prepare.outputs.new_version }}"
          cd dist/release-assets
          required=(
            "vaultline-worker_${VERSION}_amd64.deb"
            "vaultline-worker_${VERSION}_arm64.deb"
            "vaultline-worker_${VERSION}_windows-amd64.exe"
            "vaultline-worker_${VERSION}_windows-amd64.msi"
          )
          for asset in "${required[@]}"; do
            test -s "$asset"
          done
          sha256sum "${required[@]}" > "vaultline-worker_${VERSION}_SHA256SUMS"
          test -s "vaultline-worker_${VERSION}_SHA256SUMS"

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_body.md \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            ${{ inputs.prerelease && '--latest=false' || '' }} \
            "dist/release-assets/vaultline-worker_${VERSION}_amd64.deb" \
            "dist/release-assets/vaultline-worker_${VERSION}_arm64.deb" \
            "dist/release-assets/vaultline-worker_${VERSION}_windows-amd64.exe" \
            "dist/release-assets/vaultline-worker_${VERSION}_windows-amd64.msi" \
            "dist/release-assets/vaultline-worker_${VERSION}_SHA256SUMS"
