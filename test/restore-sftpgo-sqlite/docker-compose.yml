version: "3"

# Manual SFTPGo/SQLite permission verification with a restic repository.
# This replaces the removed root-owned .tar.gz flow and keeps the same
# profiles: it reproduces the non-root SQLite failure mode (a restored
# root-owned sftpgo.db and a root-owned parent directory can raise "attempt
# to write a readonly database" for the SFTPGo runtime user) and verifies
# RESTORE_CHOWN fixes it.
# The restic snapshot keeps the seeded source directory name inside the
# snapshot (as test/restore-restic demonstrates), so the restored database
# lives at /srv/sftpgo/source/sftpgo.db behind the shared volume; the parent
# directory reproduced by the scenario is that restored source directory.
# Non-Docker caveat: run the profiles on Linux to confirm the ownership
# expectations; wrong expectations make the verify services fail loudly.
# Suggested flow:
#   docker compose --profile setup up seed-sftpgo-backup
#   docker compose --profile readonly up restore-root-owned
#   docker compose --profile readonly up verify-readonly-database-fails
#   docker compose --profile writable up restore-chown
#   docker compose --profile writable up verify-sftpgo-user-can-write

services:

  seed-sftpgo-backup:
    build: ../..
    profiles: ["setup"]
    entrypoint: /bin/sh
    command: >
      -c "rm -rf /restic-repo/* /source/* &&
          mkdir -p /source &&
          python3 -c \"import sqlite3; conn = sqlite3.connect('/source/sftpgo.db'); conn.execute('create table if not exists checks(id integer primary key, value text)'); conn.execute('insert into checks(value) values (?)', ('seed',)); conn.commit(); conn.close()\" &&
          chown -R 0:0 /source &&
          chmod 755 /source &&
          chmod 644 /source/sftpgo.db &&
          restic init || true &&
          restic backup /source"
    environment:
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - restic-repo:/restic-repo
      - restic-source:/source

  restore-root-owned:
    build: ../..
    profiles: ["readonly"]
    environment:
      RESTORE_MODE: "true"
      RESTORE_TARGET_PATH: /restore-target
      RESTORE_DRY_RUN: "false"
      RESTORE_FORCE_OVERWRITE: "true"
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - sftpgo-data:/restore-target
      - restic-repo:/restic-repo

  verify-readonly-database-fails:
    image: python:3.11.17-alpine
    profiles: ["readonly"]
    user: "1000:1000"
    depends_on:
      restore-root-owned:
        condition: service_completed_successfully
    command: >
      python -c "exec('''import sqlite3\nimport sys\nconn = sqlite3.connect('/srv/sftpgo/source/sftpgo.db')\ncur = conn.cursor()\ntry:\n    cur.execute('insert into checks(value) values (?)', ('should-fail',))\n    conn.commit()\nexcept sqlite3.OperationalError as exc:\n    print(exc)\n    message = str(exc).lower()\n    sys.exit(0 if 'readonly' in message or 'unable to open database file' in message else 1)\nsys.exit(1)''')"
    volumes:
      - sftpgo-data:/srv/sftpgo

  restore-chown:
    build: ../..
    profiles: ["writable"]
    environment:
      RESTORE_MODE: "true"
      RESTORE_TARGET_PATH: /restore-target
      RESTORE_DRY_RUN: "false"
      RESTORE_FORCE_OVERWRITE: "true"
      RESTORE_CHOWN: "1000:1000"
      RESTIC_REPOSITORY: /restic-repo
      RESTIC_PASSWORD: restic-test-password
    volumes:
      - sftpgo-data:/restore-target
      - restic-repo:/restic-repo

  verify-sftpgo-user-can-write:
    image: python:3.11.17-alpine
    profiles: ["writable"]
    user: "1000:1000"
    depends_on:
      restore-chown:
        condition: service_completed_successfully
    command: >
      python -c "import sqlite3;
      conn = sqlite3.connect('/srv/sftpgo/source/sftpgo.db');
      conn.execute('insert into checks(value) values (?)', ('write-ok',));
      conn.commit(); conn.close()"
    volumes:
      - sftpgo-data:/srv/sftpgo

volumes:
  sftpgo-data:
  restic-repo:
  restic-source:
